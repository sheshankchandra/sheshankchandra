name: Update Todoist activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: todoist-readme
  cancel-in-progress: true

jobs:
  update-readme:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update Todoist activity
        run: node .github/scripts/update-todoist-readme.mjs
        env:
          TODOIST_API_KEY: ${{ secrets.TODOIST_API_KEY }}

      - name: Publish updated stats
        run: |
          if git diff --quiet -- README.md; then
            echo "Todoist activity is already up to date."
            exit 0
          fi

          git config user.name "Sheshank Chandra"
          git config user.email "82082604+sheshankchandra@users.noreply.github.com"
          git add README.md
          git commit -m "Update Todoist activity"
          git push
